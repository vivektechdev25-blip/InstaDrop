name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both runtimes production actually uses: Netlify builds the
        # frontend on 20 (NODE_VERSION), while the API image's Playwright
        # base (v1.62.1-jammy) ships Node 24 - verified with
        # `docker run --entrypoint node <image> --version` on 2026-10-14.
        node: [20, 24]
    env:
      # Unit tests stub Playwright; no job here launches a real browser.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      # No version input: reads "packageManager" (pnpm@9.0.0) from the
      # root package.json, so CI can't drift from local and Netlify.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds packages/types, apps/api and apps/web in dependency order.
      # NEXT_PUBLIC_* fall back to the code's own defaults - this checks the
      # build, it doesn't produce a deployable artifact.
      - name: Build
        run: pnpm build

  docker:
    name: API Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same file and repo-root context Railway builds with (railway.json).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: reelsavenow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
